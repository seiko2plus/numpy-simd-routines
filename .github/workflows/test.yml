name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpfr-dev
          pip install -r test_requirements.txt
      - run: spin lint

  smoke:
    name: smoke
    uses: ./.github/workflows/build-test.yml
    with:
      os: ubuntu-24.04
      cc: gcc
      cxx: g++
      targets: sse4,avx2

  test:
    needs: smoke
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, targets: "sse4,avx2" }
          - { os: ubuntu-24.04-arm, cc: gcc, cxx: g++,
              targets: neon_without_aes }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++,
              targets: neon_without_aes }
    uses: ./.github/workflows/build-test.yml
    with:
      os: ${{ matrix.os }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      targets: ${{ matrix.targets }}

  ibm:
    # Native IBM runners exist only upstream (see numpy/numpy#29125). On s390x,
    # Highway builds Z14/Z15 only on a z14 zvector baseline, and never with
    # clang < 19.
    if: github.repository == 'numpy/numpy-simd-routines'
    needs: smoke
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: ppc64le, runner: ubuntu-24.04-ppc64le-p10,
              cc: gcc, cxx: g++, targets: "ppc8,ppc10" }
          - { arch: ppc64le, runner: ubuntu-24.04-ppc64le-p10,
              cc: clang, cxx: clang++, targets: "ppc8,ppc10" }
          - { arch: s390x, runner: ubuntu-24.04-s390x,
              cc: gcc, cxx: g++, targets: "z14,z15",
              args: '-Dcpp_args="-march=z14 -mzvector"' }
          - { arch: s390x, runner: ubuntu-24.04-s390x,
              cc: clang-20, cxx: clang++-20, targets: "z14,z15",
              args: '-Dcpp_args="-march=z14 -mzvector"' }
    uses: ./.github/workflows/build-test.yml
    with:
      os: ${{ matrix.runner }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      targets: ${{ matrix.targets }}
      args: ${{ matrix.args }}
      venv: true

  riscv:
    # RISE runners: only the `rvv` label gets a board with RVV 1.0. Highway
    # dispatches RVV only from clang 19 or gcc 15, so raise the baseline.
    if: github.repository == 'numpy/numpy-simd-routines'
    needs: smoke
    name: riscv64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang-20, cxx: clang++-20 }
    uses: ./.github/workflows/build-test.yml
    with:
      os: ubuntu-24.04-riscv
      label: rvv
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      targets: rvv
      args: -Dcpp_args=-march=rv64gcv
      venv: true

  armhf:
    # 32-bit ARM hard-float in compat mode on the arm64 runner. Highway has no
    # runtime dispatch on armv7 and needs VFPv4 for NEON, so raise the baseline.
    needs: smoke
    name: armhf / ${{ matrix.cxx }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: |
          docker run --rm -e CC=${{ matrix.cc }} -e CXX=${{ matrix.cxx }} \
            -v "$PWD:/src" -w /src arm32v7/ubuntu:24.04 \
            /bin/linux32 /bin/bash -eo pipefail -c '
              apt-get update
              apt-get install -y build-essential clang git pkg-config \
                                 libmpfr-dev python3-dev python3-venv
              python3 -m venv /venv
              /venv/bin/pip install -r test_requirements.txt
              export PATH=/venv/bin:$PATH
              spin build -- -Dc_args=-mfpu=neon-vfpv4 \
                            -Dcpp_args=-mfpu=neon-vfpv4
              spin python -- -c "import numpy_sr as sr; print(sorted(
                n for n, t in sr.targets.items() if t.IS_SUPPORTED))"
              spin test -j auto --target neon_without_aes
            '
